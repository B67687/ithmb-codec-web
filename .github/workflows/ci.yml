# ci.yml — the web repo's only automated gate.
# Runs on BOTH repos (dev + public). CI is the source of truth per the
# four-layer model (local -> github CI -> public mirror). Public repos get
# unlimited free Actions minutes, so public CI is a free fallback when the
# private dev repo exhausts its 2,000-min private limit.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: # doc-only pushes skip CI (docs only; workflow changes still run)
      - "docs/**"
      - "*.md"
  workflow_dispatch: {} # allow manual re-run, e.g. after enabling on a repo
  pull_request:
    # Skip the whole CI for doc-only PRs (no code changed): preserves free
    # Actions minutes with negligible quality loss. Code PRs always run full.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
permissions: { contents: read }

concurrency: # superseded runs cancel automatically (rapid pushes don't stack matrices)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 # Phase 1: npm scripts invoke bun (build, i18n)
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: biome format gate (1.9.4, format-only)
        run: npx --yes @biomejs/biome@1.9.4 format .
      - name: lint:modules (typecheck + build + determinism)
        run: bun run lint:modules && git diff --exit-code # fail if the build mutated tracked files (uncommitted ?v= hashes)
      - name: unit tests (bun test)
        run: bun run test:unit

  guard:
    # Trailer gate: [skip browsers] counts only on its OWN line (footer).
    # contains() matched message bodies that merely named the trailer (bit twice).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -qxF '[skip browsers]'; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  test-chromium:
    # Fast iteration driver: runs on push + PR (unless [skip browsers]).
    needs: [guard]
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 # Phase 1: Build step runs on bun
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-
      - name: Install Playwright system deps (apt only)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Build (TS -> JS)
        run: bun run build
      - name: Playwright (chromium, local server)
        env:
          PLAYWRIGHT_BROWSER: chromium
        run: |
          npx playwright test --project=chromium

  test-firefox:
    # Full coverage only on PR: push to main stays fast (chromium-only).
    needs: [guard]
    if: needs.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 # Phase 1: Build step runs on bun
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-firefox-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            pw-firefox-${{ runner.os }}-
      - name: Install Playwright system deps (apt only)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox
      - name: Install Playwright firefox
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
      - name: Build (TS -> JS)
        run: bun run build
      - name: Playwright (firefox, local server)
        env:
          PLAYWRIGHT_BROWSER: firefox
        run: |
          npx playwright test --project=firefox

  test-webkit-1-2:
    # Webkit shard 1/2: PR-only, halves the 6m18s bottleneck. Unique job
    # name avoids artifact/step collisions with shard 2/2.
    needs: [guard]
    if: needs.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 # Phase 1: Build step runs on bun
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-webkit-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            pw-webkit-${{ runner.os }}-
      - name: Install Playwright system deps (apt only)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Install Playwright webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - name: Build (TS -> JS)
        run: bun run build
      - name: Playwright (webkit shard 1/2, local server)
        env:
          PLAYWRIGHT_BROWSER: webkit
        run: |
          npx playwright test --project=webkit --shard=1/2

  test-webkit-2-2:
    # Webkit shard 2/2: PR-only, complements test-webkit-1-2.
    needs: [guard]
    if: needs.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 # Phase 1: Build step runs on bun
        with:
          bun-version: "1.3.14"
      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-webkit-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            pw-webkit-${{ runner.os }}-
      - name: Install Playwright system deps (apt only)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Install Playwright webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - name: Build (TS -> JS)
        run: bun run build
      - name: Playwright (webkit shard 2/2, local server)
        env:
          PLAYWRIGHT_BROWSER: webkit
        run: |
          npx playwright test --project=webkit --shard=2/2
