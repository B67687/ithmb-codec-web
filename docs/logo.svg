<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- README hero logo: the same gradient "iT" app mark as favicon.svg, held
       at 56/64 with transparent breathing room so it reads lighter at 96px,
       matching the Rust codec repo's click-wheel icon. Geometry is shared with
       favicon.svg (paths, no <text>) so one source drives the whole icon set. -->
  <defs>
    <linearGradient id="iT-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff" />
      <stop offset="1" stop-color="#0071e3" />
    </linearGradient>
  </defs>
  <g transform="translate(4 4) scale(0.875)">
    <rect width="64" height="64" rx="14" fill="url(#iT-grad)" />
    <g fill="#fff">
      <circle cx="16" cy="20" r="4" />
      <rect x="12" y="28" width="8" height="16" rx="4" />
      <rect x="28" y="16" width="24" height="8" rx="4" />
      <rect x="36" y="20" width="8" height="24" rx="4" />
    </g>
  </g>
</svg>
